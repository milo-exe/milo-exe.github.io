<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>milo-exe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* ── background ── */
    body {
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* gif background */
    .bg-gif {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* dark overlay so text stays readable over any gif */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(0,0,0,0.45);
    }

    /* fallback city-lights layer (shown when no gif) */
    .bg-fallback {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 30% 20% at 15% 75%, rgba(255,220,120,0.07) 0%, transparent 100%),
        radial-gradient(ellipse 20% 15% at 80% 80%, rgba(255,200,80,0.05) 0%, transparent 100%),
        radial-gradient(ellipse 40% 30% at 50% 90%, rgba(255,230,150,0.04) 0%, transparent 100%),
        radial-gradient(ellipse 60% 50% at 50% 110%, rgba(30,30,60,0.8) 0%, transparent 100%),
        radial-gradient(ellipse 100% 60% at 50% 100%, rgba(10,10,20,1) 0%, transparent 80%);
      background-color: #0a0a0f;
    }

    /* grain filter */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 2;
      opacity: 0.55;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.15'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    /* faint city silhouette */
    .skyline {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 45%;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    .skyline::before {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 100%;
      background:
        linear-gradient(to top, #111118 0%, transparent 100%),
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 18px,
          rgba(20,20,30,0.9) 18px,
          rgba(20,20,30,0.9) 38px,
          transparent 38px,
          transparent 56px,
          rgba(15,15,25,0.85) 56px,
          rgba(15,15,25,0.85) 80px,
          transparent 80px,
          transparent 100px,
          rgba(18,18,28,0.9) 100px,
          rgba(18,18,28,0.9) 130px,
          transparent 130px,
          transparent 152px,
          rgba(12,12,22,0.88) 152px,
          rgba(12,12,22,0.88) 175px,
          transparent 175px,
          transparent 200px,
          rgba(20,20,30,0.9) 200px,
          rgba(20,20,30,0.9) 228px,
          transparent 228px,
          transparent 260px,
          rgba(16,16,26,0.87) 260px,
          rgba(16,16,26,0.87) 295px
        );
      mask: linear-gradient(to bottom, transparent 0%, black 60%);
      -webkit-mask: linear-gradient(to bottom, transparent 0%, black 60%);
    }

    /* scattered window lights */
    .lights {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .lights span {
      position: absolute;
      border-radius: 1px;
      background: rgba(255,220,140,0.55);
      box-shadow: 0 0 4px rgba(255,220,140,0.4);
    }

    /* ── profile card ── */
    .card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      user-select: none;
    }

    /* avatar */
    .avatar-wrap {
      position: relative;
      margin-bottom: 18px;
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(160deg, #2a2a2a, #111);
      border: 2px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 40px rgba(0,0,0,0.8);
    }
    .avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .avatar svg { width: 54px; height: 54px; opacity: 0.7; }

    /* name */
    .name {
      font-size: 46px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -1.5px;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    }

    /* discord status badge */
    .discord-status {
      display: none;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #80848e;
      flex-shrink: 0;
    }
    .status-dot.online  { background: #23a55a; box-shadow: 0 0 6px rgba(35,165,90,0.6); }
    .status-dot.idle    { background: #f0b232; box-shadow: 0 0 6px rgba(240,178,50,0.5); }
    .status-dot.dnd     { background: #f23f43; box-shadow: 0 0 6px rgba(242,63,67,0.5); }
    .status-dot.offline { background: #80848e; }
    .status-label {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }

    /* location */
    .location {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 28px;
    }
    .location svg { width: 12px; height: 12px; fill: rgba(255,255,255,0.45); }

    /* bio */
    .bio {
      font-size: 15px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 28px;
      margin-top: -18px;
      min-height: 1.2em;
    }
    .bio-cursor {
      display: inline-block;
      color: rgba(255,255,255,0.4);
      animation: blink 0.7s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* socials */
    .socials {
      display: flex;
      gap: 14px;
      margin-bottom: 0;
    }
    .social-btn {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 0.18s, transform 0.18s, box-shadow 0.18s;
      backdrop-filter: blur(6px);
    }
    .social-btn:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .social-btn svg { width: 22px; height: 22px; fill: rgba(255,255,255,0.85); }

    /* custom tooltip */
    .social-tip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,10,15,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8);
      font-size: 11px;
      white-space: nowrap;
      padding: 4px 10px;
      border-radius: 6px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
      transform: translateX(-50%) translateY(4px);
      backdrop-filter: blur(8px);
    }
    .social-btn:hover .social-tip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* projects row */
    .projects {
      margin-top: 28px;
      display: flex;
      gap: 10px;
    }
    .proj-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: background 0.15s, color 0.15s;
    }
    .proj-chip:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .proj-chip svg { width: 13px; height: 13px; fill: currentColor; opacity: 0.7; }

    /* visitor counter */
    .visitor-counter {
      margin-top: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.22);
      display: none;
      letter-spacing: 0.03em;
    }

    /* audio player */
    .audio-player {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 8px 16px 8px 10px;
      backdrop-filter: blur(12px);
    }
    .audio-play-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .audio-play-btn:hover { background: rgba(255,255,255,0.2); }
    .audio-play-btn svg { width: 12px; height: 12px; fill: #fff; }
    .audio-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
      outline: none;
      cursor: pointer;
    }
    .audio-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }
    .audio-label {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      white-space: nowrap;
    }

    /* now playing widget */
    .now-playing {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 20;
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 10px 14px 10px 10px;
      backdrop-filter: blur(12px);
      max-width: 220px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .now-playing:hover { background: rgba(255,255,255,0.1); }
    .np-art {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255,255,255,0.08);
    }
    .np-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .np-label {
      font-size: 9px;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .np-label svg { width: 9px; height: 9px; fill: #1DB954; flex-shrink: 0; }
    .np-song {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .np-artist {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<script>
  // ── background gif
  const bgGif = document.getElementById("bgGif");
  const bgFallback = document.getElementById("bgFallback");
  if (bgGif.src && bgGif.src !== window.location.href) {
    bgFallback.style.display = "none";
    bgGif.onerror = () => { bgFallback.style.display = ""; bgGif.style.display = "none"; };
  } else {
    bgGif.style.display = "none";
  }

  // ── pfp gif
  const pfpImg = document.getElementById("pfpImg");
  const pfpFallback = document.getElementById("pfpFallback");
  if (pfpImg.src && pfpImg.src !== window.location.href) {
    pfpFallback.style.display = "none";
    pfpImg.onerror = () => { pfpFallback.style.display = ""; pfpImg.style.display = "none"; };
  } else {
    pfpImg.style.display = "none";
  }

  // ── audio player
  const bgAudio = document.getElementById("bgAudio");
  const audioPlayer = document.getElementById("audioPlayer");
  if (bgAudio.src && bgAudio.src !== window.location.href) {
    audioPlayer.style.display = "flex";
    bgAudio.volume = 0.5;
  }
  let playing = false;
  function toggleAudio() {
    if (playing) {
      bgAudio.pause();
      document.getElementById("playIcon").innerHTML = '<path d="M8 5v14l11-7z"/>';
    } else {
      bgAudio.play();
      document.getElementById("playIcon").innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }
    playing = !playing;
  }
  function setVolume(v) { bgAudio.volume = v; }

  // ── window lights
  const container = document.getElementById("lights");
  for (let i = 0; i < 120; i++) {
    const el = document.createElement("span");
    el.style.cssText = `left:${Math.random()*100}%;top:${40+Math.random()*55}%;width:${1+Math.random()*2}px;height:${1+Math.random()*3}px;opacity:${0.15+Math.random()*0.5};`;
    container.appendChild(el);
  }

  // ── 1. typing effect
  const bioEl = document.getElementById("bio");
  const bioText = "LyricPresence out now!";
  let typed = "";
  const cursor = document.createElement("span");
  cursor.className = "bio-cursor";
  cursor.textContent = "|";
  bioEl.appendChild(cursor);
  let charIndex = 0;
  function typeNext() {
    if (charIndex < bioText.length) {
      typed += bioText[charIndex++];
      bioEl.firstChild?.remove();
      const textNode = document.createTextNode(typed);
      bioEl.insertBefore(textNode, cursor);
      setTimeout(typeNext, 55 + Math.random() * 45);
    } else {
      setTimeout(() => cursor.style.display = "none", 1400);
    }
  }
  setTimeout(typeNext, 700);

  // ── 2. cursor trail
  const canvas = document.getElementById("trailCanvas");
  const ctx = canvas.getContext("2d");
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  const particles = [];
  window.addEventListener("mousemove", e => {
    for (let i = 0; i < 4; i++) {
      particles.push({
        x: e.clientX, y: e.clientY,
        r: Math.random() * 2.5 + 0.5,
        a: 0.6 + Math.random() * 0.2,
        vx: (Math.random() - 0.5) * 1.8,
        vy: (Math.random() - 0.5) * 1.8 - 0.4
      });
    }
  });
  (function animateTrail() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.a -= 0.025; p.r *= 0.97;
      if (p.a <= 0) { particles.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${p.a})`;
      ctx.fill();
    }
    requestAnimationFrame(animateTrail);
  })();

  // ── 4 & 7. Lanyard (now playing + discord status)
  // Requires joining discord.gg/lanyard to opt in
  const DISCORD_ID = "1384549535614894162";

  function updateNowPlaying(data) {
    const sp = data.spotify;
    const widget = document.getElementById("nowPlaying");
    if (!sp) { widget.style.display = "none"; return; }
    document.getElementById("npArt").src = sp.album_art_url || "";
    document.getElementById("npSong").textContent = sp.song || "";
    document.getElementById("npArtist").textContent = sp.artist || "";
    widget.href = sp.track_id ? `https://open.spotify.com/track/${sp.track_id}` : "#";
    widget.style.display = "flex";
  }

  function updateDiscordStatus(data) {
    const status = data.discord_status || "offline";
    const labels = { online: "online", idle: "idle", dnd: "do not disturb", offline: "offline" };
    const dot = document.getElementById("statusDot");
    dot.className = "status-dot " + status;
    document.getElementById("statusLabel").textContent = labels[status] || "offline";
    document.getElementById("discordStatus").style.display = "flex";
  }

  async function fetchLanyard() {
    try {
      const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
      if (!res.ok) return;
      const json = await res.json();
      updateNowPlaying(json.data);
      updateDiscordStatus(json.data);
    } catch(e) {}
  }
  fetchLanyard();
  setInterval(fetchLanyard, 30000);

  // ── 6. visitor counter
  fetch("https://api.counterapi.dev/v1/milo-exe-github-io/main/up")
    .then(r => r.json())
    .then(d => {
      if (!d.count) return;
      document.getElementById("visitorCount").textContent = d.count.toLocaleString();
      document.getElementById("visitorCounter").style.display = "block";
    })
    .catch(() => {});
</script>
</body>
</html>
