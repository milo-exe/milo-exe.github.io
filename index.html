<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>milo-exe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* ── background ── */
    body {
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* gif background */
    .bg-gif {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* dark overlay so text stays readable over any gif */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(0,0,0,0.45);
    }

    /* fallback city-lights layer (shown when no gif) */
    .bg-fallback {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 30% 20% at 15% 75%, rgba(255,220,120,0.07) 0%, transparent 100%),
        radial-gradient(ellipse 20% 15% at 80% 80%, rgba(255,200,80,0.05) 0%, transparent 100%),
        radial-gradient(ellipse 40% 30% at 50% 90%, rgba(255,230,150,0.04) 0%, transparent 100%),
        radial-gradient(ellipse 60% 50% at 50% 110%, rgba(30,30,60,0.8) 0%, transparent 100%),
        radial-gradient(ellipse 100% 60% at 50% 100%, rgba(10,10,20,1) 0%, transparent 80%);
      background-color: #0a0a0f;
    }

    /* grain filter */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 2;
      opacity: 0.55;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.15'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    /* faint city silhouette */
    .skyline {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 45%;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    .skyline::before {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 100%;
      background:
        linear-gradient(to top, #111118 0%, transparent 100%),
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 18px,
          rgba(20,20,30,0.9) 18px,
          rgba(20,20,30,0.9) 38px,
          transparent 38px,
          transparent 56px,
          rgba(15,15,25,0.85) 56px,
          rgba(15,15,25,0.85) 80px,
          transparent 80px,
          transparent 100px,
          rgba(18,18,28,0.9) 100px,
          rgba(18,18,28,0.9) 130px,
          transparent 130px,
          transparent 152px,
          rgba(12,12,22,0.88) 152px,
          rgba(12,12,22,0.88) 175px,
          transparent 175px,
          transparent 200px,
          rgba(20,20,30,0.9) 200px,
          rgba(20,20,30,0.9) 228px,
          transparent 228px,
          transparent 260px,
          rgba(16,16,26,0.87) 260px,
          rgba(16,16,26,0.87) 295px
        );
      mask: linear-gradient(to bottom, transparent 0%, black 60%);
      -webkit-mask: linear-gradient(to bottom, transparent 0%, black 60%);
    }

    /* scattered window lights */
    .lights {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .lights span {
      position: absolute;
      border-radius: 1px;
      background: rgba(255,220,140,0.55);
      box-shadow: 0 0 4px rgba(255,220,140,0.4);
    }

    /* ── profile card ── */
    .card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      user-select: none;
    }

    /* avatar */
    .avatar-wrap {
      position: relative;
      margin-bottom: 18px;
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(160deg, #2a2a2a, #111);
      border: 2px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 40px rgba(0,0,0,0.8);
    }
    .avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .avatar svg { width: 54px; height: 54px; opacity: 0.7; }

    /* name */
    .name {
      font-size: 46px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -1.5px;
      line-height: 1;
      margin-bottom: 10px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    }

    /* location */
    .location {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 28px;
    }
    .location svg { width: 12px; height: 12px; fill: rgba(255,255,255,0.45); }

    /* bio */
    .bio {
      font-size: 15px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 28px;
      margin-top: -18px;
    }

    /* socials */
    .socials {
      display: flex;
      gap: 14px;
      margin-bottom: 0;
    }
    .social-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 0.18s, transform 0.18s, box-shadow 0.18s;
      backdrop-filter: blur(6px);
    }
    .social-btn:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .social-btn svg { width: 22px; height: 22px; fill: rgba(255,255,255,0.85); }

    /* projects row */
    .projects {
      margin-top: 28px;
      display: flex;
      gap: 10px;
    }
    .proj-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: background 0.15s, color 0.15s;
    }
    .proj-chip:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .proj-chip svg { width: 13px; height: 13px; fill: currentColor; opacity: 0.7; }

    /* audio player */
    .audio-player {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 8px 16px 8px 10px;
      backdrop-filter: blur(12px);
    }
    .audio-play-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .audio-play-btn:hover { background: rgba(255,255,255,0.2); }
    .audio-play-btn svg { width: 12px; height: 12px; fill: #fff; }
    .audio-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
      outline: none;
      cursor: pointer;
    }
    .audio-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }
    .audio-label {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      white-space: nowrap;
    }
  </style>
</head>
<body>

<!-- =============================================
  BACKGROUND GIF
  Drop your gif into this folder and set the src below.
  Example: src="bg.gif"
  Leave src="" to use the fallback city background.
================================================ -->
<img class="bg-gif" id="bgGif" src="bg.gif" alt="">
<div class="bg-overlay"></div>
<div class="bg-fallback" id="bgFallback"></div>
<div class="grain"></div>
<div class="skyline"></div>

<!-- generated window lights -->
<div class="lights" id="lights"></div>

<div class="card">
  <div class="avatar-wrap">
    <div class="avatar">
      <!-- =============================================
        PROFILE PICTURE / GIF
        Drop your pfp or gif into this folder and set src below.
        Example: src="pfp.gif"  or  src="avatar.png"

      ================================================ -->
      <img id="pfpImg" src="pfp.gif" alt="avatar">
      <svg id="pfpFallback" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">

    Europe
  </div>

  <div class="bio">
    LyricPresence out now!
  </div>

  <div class="socials">
    <!-- TikTok -->
    <a class="social-btn" href="https://tiktok.com/hatinglarps" title="TikTok">
      <svg viewBox="0 0 24 24" fill="rgba(255,255,255,0.85)"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.75a4.85 4.85 0 0 1-1.01-.06z"/></svg>
    </a>
    <!-- Discord -->
    <a class="social-btn" href="https://discord.com/users/1384549535614894162" title="Discord">
      <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>

    <!-- Email — change to your address -->
    <a class="social-btn" href="mailto:legally@europe.com" title="Email">

    </a>
  </div>

  <!-- PROJECT CHIPS — change hrefs or add/remove chips as needed -->
  <div class="projects">

  </div>
</div>

<!-- =============================================
  AUDIO
  Drop your audio file into this folder and set src below.
  Example: src="audio.mp3"
  Leave src="" to hide the player entirely.
================================================ -->
<audio id="bgAudio" loop src=""></audio>

<div class="audio-player" id="audioPlayer" style="display:none;">
  <button class="audio-play-btn" id="playBtn" onclick="toggleAudio()">
    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <input class="audio-slider" id="volSlider" type="range" min="0" max="1" step="0.01" value="0.5" oninput="setVolume(this.value)">
  <span class="audio-label">music</span>
</div>

<script>
  // background gif — hide fallback if a src is set and loads
  const bgGif = document.getElementById("bgGif");
  const bgFallback = document.getElementById("bgFallback");
  if (bgGif.src && bgGif.src !== window.location.href) {
    bgFallback.style.display = "none";
    bgGif.onerror = () => { bgFallback.style.display = ""; bgGif.style.display = "none"; };
  } else {
    bgGif.style.display = "none";
  }

  // pfp gif — hide fallback svg if a src is set and loads
  const pfpImg = document.getElementById("pfpImg");
  const pfpFallback = document.getElementById("pfpFallback");
  if (pfpImg.src && pfpImg.src !== window.location.href) {
    pfpFallback.style.display = "none";
    pfpImg.onerror = () => { pfpFallback.style.display = ""; pfpImg.style.display = "none"; };
  } else {
    pfpImg.style.display = "none";
  }

  // audio player
  const bgAudio = document.getElementById("bgAudio");
  const audioPlayer = document.getElementById("audioPlayer");
  if (bgAudio.src && bgAudio.src !== window.location.href) {
    audioPlayer.style.display = "flex";
    bgAudio.volume = 0.5;
  }
  let playing = false;
  function toggleAudio() {
    if (playing) {
      bgAudio.pause();
      document.getElementById("playIcon").innerHTML = '<path d="M8 5v14l11-7z"/>';
    } else {
      bgAudio.play();
      document.getElementById("playIcon").innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }
    playing = !playing;
  }
  function setVolume(v) { bgAudio.volume = v; }

  // scatter tiny window-light rectangles across the lower half
  const container = document.getElementById("lights");
  for (let i = 0; i < 120; i++) {
    const el = document.createElement("span");
    el.style.cssText = `left:${Math.random()*100}%;top:${40+Math.random()*55}%;width:${1+Math.random()*2}px;height:${1+Math.random()*3}px;opacity:${0.15+Math.random()*0.5};`;
    container.appendChild(el);
  }
</script>
</body>
</html>
